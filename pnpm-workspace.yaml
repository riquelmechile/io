# The workspace contains five first-party packages, each a TRANSITIONAL slice
# of the IO foundation (not canonical product packages — canonical extraction
# lands under change pressure):
#   packages/app             — worker-process shell + vertical logic: worker cycle (claim→finalize), sandbox,
#                              journal marker, and the E2E suite vs live PostgreSQL (packages/app/test/e2e)
#   packages/business-domain — pure domain types/ports/use-cases/validation (zero @io/*)
#   packages/database        — PostgreSQL-shaped DbConnection + adapters over live PG 18.4
#   packages/llm-client      — DeepSeek V4 adapter over the `openai` SDK (confined)
#   packages/trust-kernel    — authority kernel: SoD, windows, pipeline (in-memory)
# No apps/ tree is created beyond packages/app. See each package's README.
packages:
  - 'packages/*'
# Strict dependency engines. The root package.json engines.node is always
# enforced by pnpm against the real runtime. Never set nodeVersion here (it
# makes pnpm assume a Node version and bypasses real-runtime enforcement).
engineStrict: true
minimumReleaseAgeExclude:
  - openai@7.3.0
