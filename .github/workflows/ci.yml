name: Toolchain

# Additive application/toolchain CI: runs the same secret-free, check-only,
# non-mutating local gates under the enforced Node 24 LTS runtime. This workflow
# does NOT replace .github/workflows/pr-validation.yml (governance).
#
# PostgreSQL integration is REQUIRED in CI (task 3.9 / C6): the database slice's
# integration suites AND the packages/app E2E suites run against the postgres:18
# service container below and MUST pass — the IO_REQUIRE_PG=1 marker flips the
# reachability probe from "skip when PG is missing" (local-dev behavior) to
# "FAIL LOUDLY", so CI can never silently skip the live-PG tests. The app E2E
# (`packages/app/test/e2e/*.integration.test.ts`) is discovered by the root
# vitest include pattern (`packages/**/test/**/*.test.ts`) inside `pnpm check` —
# it is NOT excluded, so it runs here against the same PG service and fails
# loudly (ECONNREFUSED) if the database is unavailable. The DeepSeek external-API
# round-trip remains skipped (no DEEPSEEK_API_KEY in CI) — unrelated to PostgreSQL.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: io
          POSTGRES_PASSWORD: io_dev
          POSTGRES_DB: io_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U io -d io_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # pgConnectionString() defaults to the same URL; set explicitly so the
      # wiring is visible and the integration tests are deterministic.
      DATABASE_URL: postgresql://io:io_dev@localhost:5432/io_dev
      IO_REQUIRE_PG: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # reads version from package.json `packageManager`

      - name: Setup Node 24 LTS (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run ordered quality gates # format-check -> typecheck -> build -> lint -> test
        run: pnpm run check
