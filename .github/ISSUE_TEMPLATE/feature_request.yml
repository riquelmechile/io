name: Feature request
description: Propose an improvement to IO
title: "[Feature]: "
labels:
  - enhancement
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A maintainer must approve this issue before implementation begins.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I understand that a PR requires this issue to have `status:approved`.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What need, limitation, or pain point should be addressed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior from the user's perspective.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Runtime
        - Domain model
        - Integrations
        - Documentation
        - CI / workflows
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or current workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, or references that clarify the request.
