# openspec/config.yaml
schema: spec-driven

project: io
repository: riquelmechile/io
branch: main
gentle_ai_version: 2.2.0       # Stable Organic Receipt-Driven Development release
gentle_ai_source: https://github.com/Gentleman-Programming/gentle-ai/releases/tag/v2.2.0

context: |
  Greenfield repository for IO — a digital company operated by agentic workers,
  directed by a human founder/board. No source code exists yet; the repo holds
  the foundational architecture document, accepted ADRs, and approved OpenSpec
  contracts. SDD is explicitly selected for planning IO changes.

  Intended stack (declared in that doc, Section 6, verified 2026-07-29):
    - Language:    TypeScript 6.x (installed tsc 6.0.3; TS 7 not yet declared stable)
    - Runtime:     Node.js 24 LTS (Node 26 is Current; prod MUST use an LTS line)
    - Persistence: PostgreSQL 18.4 as the authoritative source (PG 19 beta excluded)
    - LLM:         DeepSeek V4 (deepseek-v4-flash / deepseek-v4-pro), cache-first
    - Architecture: modular monolith → monorepo (apps/ + packages/, per doc Section 14)

  Hard constraint (doc 6.4/6.5): NO agentic or business frameworks allowed
  (no LangGraph, CrewAI, AutoGen, Mem0, Zep, Engram, Mastra, Paperclip, etc.).
  Only auditable infra primitives + first-party components built by IO.

# No test runner exists yet (no code). Flip to true once the TS toolchain +
# Node test runner are bootstrapped (doc Section 6.4 permits build/lint/test tools).
strict_tdd: false

testing:
  runner: none
  unit: false
  integration: false
  e2e: false
  coverage: false
  coverage_threshold: 0
  linter: none
  type_checker: none
  formatter: none
  note: |
    Greenfield. TS 6.x + a Node test runner are intended but not yet present.
    Once bootstrapped, set strict_tdd: true and populate the fields above.

delivery:
  execution_mode: auto
  artifact_store: hybrid        # OpenSpec files + Engram observations
  delivery_strategy: auto-chain
  chain_strategy: stacked-to-main
  review_budget_lines: 400
  rdd: true                     # Organic Receipt-Driven Development is native delivery authority

rules:
  proposal:
    - Include a rollback plan for risky or irreversible actions
    - Respect human constitutional authority over capital, secrets, and critical limits (doc principle 1)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Business domain rules MUST survive model/API/DB/interface changes (doc 3.2)
    - Work, contracts, approvals, memory, and results MUST declare explicit valid states (doc 3.5)
  design:
    - Modular monolith first; introduce microservices/specialized stores only on measured need (doc 3.8)
    - Document architecture decisions with rationale
    - Prefer first-party components over any agentic/business framework (doc 6.5)
    - DeepSeek context MUST follow the canonical prefix ordering (doc 7.2)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Incremental build: the minimal company MUST run and produce evidence before autonomy grows (doc principle 10)
  apply:
    guidelines:
      - Follow existing code patterns
      - Do NOT add prohibited agentic/business frameworks
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
