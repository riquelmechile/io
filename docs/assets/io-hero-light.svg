<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="io-hero-light-title io-hero-light-desc">
  <title id="io-hero-light-title">IO — empresa agéntica con trabajo verificable</title>
  <desc id="io-hero-light-desc">Hero visual claro de IO. Presenta la empresa como unidad principal y resume tres contratos: empresa primero, cero tokens cuando no hay novedad y evidencia verificable siempre.</desc>
  <defs>
    <linearGradient id="io-hero-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f6f1ff"/>
    </linearGradient>
    <linearGradient id="io-hero-light-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="io-hero-light-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#b8c8dc" stroke-width="1" opacity="0.32"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#io-hero-light-bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#io-hero-light-grid)"/>
  <circle cx="182" cy="210" r="112" fill="#eef7ff" stroke="#b8cbe0" stroke-width="2"/>
  <circle cx="182" cy="210" r="78" fill="none" stroke="url(#io-hero-light-core)" stroke-width="4"/>
  <text x="182" y="204" text-anchor="middle" fill="#10233f" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="74" font-weight="800" letter-spacing="8">IO</text>
  <text x="182" y="245" text-anchor="middle" fill="#52647c" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">EMPRESA AGÉNTICA</text>

  <text x="350" y="104" fill="#0f213b" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="800">Empresa primero.</text>
  <text x="350" y="150" fill="#233b60" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" font-weight="650">Agentes después. Trabajo verificable siempre.</text>
  <text x="350" y="194" fill="#5b6d84" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Una empresa digital que activa inteligencia sólo cuando existe trabajo real.</text>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="350" y="242" width="230" height="92" rx="18" fill="#e8f8fb" stroke="#8ac8d4"/>
    <text x="374" y="276" fill="#0e7490" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 01</text>
    <text x="374" y="306" fill="#10233f" font-size="20" font-weight="750">Empresa &gt; agente</text>

    <rect x="598" y="242" width="250" height="92" rx="18" fill="#f0ebff" stroke="#b7a5ea"/>
    <text x="622" y="276" fill="#6d28d9" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 02</text>
    <text x="622" y="306" fill="#10233f" font-size="20" font-weight="750">Silencio = 0 tokens</text>

    <rect x="866" y="242" width="256" height="92" rx="18" fill="#eaf2ff" stroke="#9cb7dc"/>
    <text x="890" y="276" fill="#2563a6" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 03</text>
    <text x="890" y="306" fill="#10233f" font-size="20" font-weight="750">Evidencia siempre</text>
  </g>

  <path d="M350 366 H1122" stroke="#b7c5d6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="350" cy="366" r="5" fill="#0891b2"/>
  <circle cx="736" cy="366" r="5" fill="#6366f1"/>
  <circle cx="1122" cy="366" r="5" fill="#7c3aed"/>
  <text x="350" y="392" fill="#66778d" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1.2">ESTRATEGIA → TRABAJO → EVIDENCIA → APRENDIZAJE</text>
</svg>