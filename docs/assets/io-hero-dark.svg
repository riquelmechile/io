<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="io-hero-dark-title io-hero-dark-desc">
  <title id="io-hero-dark-title">IO — empresa agéntica con trabajo verificable</title>
  <desc id="io-hero-dark-desc">Hero visual oscuro de IO. Presenta la empresa como unidad principal y resume tres contratos: empresa primero, cero tokens cuando no hay novedad y evidencia verificable siempre.</desc>
  <defs>
    <linearGradient id="io-hero-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#16132d"/>
    </linearGradient>
    <linearGradient id="io-hero-dark-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="io-hero-dark-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#25324a" stroke-width="1" opacity="0.24"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#io-hero-dark-bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#io-hero-dark-grid)"/>
  <circle cx="182" cy="210" r="112" fill="#0b1b30" stroke="#2b3f5f" stroke-width="2"/>
  <circle cx="182" cy="210" r="78" fill="none" stroke="url(#io-hero-dark-core)" stroke-width="4"/>
  <text x="182" y="204" text-anchor="middle" fill="#f8fafc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="74" font-weight="800" letter-spacing="8">IO</text>
  <text x="182" y="245" text-anchor="middle" fill="#94a3b8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">EMPRESA AGÉNTICA</text>

  <text x="350" y="104" fill="#f8fafc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="800">Empresa primero.</text>
  <text x="350" y="150" fill="#dbeafe" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="29" font-weight="650">Agentes después. Trabajo verificable siempre.</text>
  <text x="350" y="194" fill="#93a4bd" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">Una empresa digital que activa inteligencia sólo cuando existe trabajo real.</text>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="350" y="242" width="230" height="92" rx="18" fill="#0d2133" stroke="#1f4a5c"/>
    <text x="374" y="276" fill="#67e8f9" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 01</text>
    <text x="374" y="306" fill="#f8fafc" font-size="20" font-weight="750">Empresa &gt; agente</text>

    <rect x="598" y="242" width="250" height="92" rx="18" fill="#171b38" stroke="#403c73"/>
    <text x="622" y="276" fill="#c4b5fd" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 02</text>
    <text x="622" y="306" fill="#f8fafc" font-size="20" font-weight="750">Silencio = 0 tokens</text>

    <rect x="866" y="242" width="256" height="92" rx="18" fill="#102032" stroke="#304866"/>
    <text x="890" y="276" fill="#93c5fd" font-size="13" font-weight="800" letter-spacing="1.5">CONTRATO 03</text>
    <text x="890" y="306" fill="#f8fafc" font-size="20" font-weight="750">Evidencia siempre</text>
  </g>

  <path d="M350 366 H1122" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="350" cy="366" r="5" fill="#67e8f9"/>
  <circle cx="736" cy="366" r="5" fill="#818cf8"/>
  <circle cx="1122" cy="366" r="5" fill="#c4b5fd"/>
  <text x="350" y="392" fill="#64748b" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1.2">ESTRATEGIA → TRABAJO → EVIDENCIA → APRENDIZAJE</text>
</svg>