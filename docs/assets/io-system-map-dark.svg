<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="io-map-dark-title io-map-dark-desc">
  <title id="io-map-dark-title">Mapa operativo de IO</title>
  <desc id="io-map-dark-desc">Mapa oscuro del sistema IO: la empresa produce eventos, el heartbeat determinístico decide si existe novedad; sin novedad se gastan cero tokens, con novedad se despacha trabajo hacia worker y sandbox, y el resultado vuelve como evidencia y aprendizaje.</desc>
  <defs>
    <linearGradient id="io-map-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#11162c"/>
    </linearGradient>
    <marker id="io-map-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="io-map-dark-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#io-map-dark-bg)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="800">Una empresa que despierta sólo cuando hay trabajo real</text>
  <text x="60" y="96" fill="#94a3b8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">El LLM aparece después de una decisión determinística, no antes.</text>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="56" y="172" width="176" height="112" rx="20" fill="#0e2033" stroke="#2b4961" stroke-width="2"/>
    <text x="78" y="205" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="1.4">01 · EMPRESA</text>
    <text x="78" y="237" fill="#f8fafc" font-size="21" font-weight="750">Estrategia</text>
    <text x="78" y="264" fill="#9fb0c4" font-size="14">procesos · puestos</text>

    <rect x="282" y="172" width="176" height="112" rx="20" fill="#101d31" stroke="#30435c" stroke-width="2"/>
    <text x="304" y="205" fill="#93c5fd" font-size="12" font-weight="800" letter-spacing="1.4">02 · EVENTOS</text>
    <text x="304" y="237" fill="#f8fafc" font-size="21" font-weight="750">PostgreSQL</text>
    <text x="304" y="264" fill="#9fb0c4" font-size="14">stream append-only</text>

    <path d="M538 228 L610 166 L682 228 L610 290 Z" fill="#171b38" stroke="url(#io-map-dark-accent)" stroke-width="2.5"/>
    <text x="610" y="212" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="800" letter-spacing="1.2">03 · GATE</text>
    <text x="610" y="239" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="750">¿Novedad?</text>
    <text x="610" y="261" text-anchor="middle" fill="#9fb0c4" font-size="12">heartbeat puro</text>

    <rect x="760" y="172" width="176" height="112" rx="20" fill="#151a33" stroke="#413e70" stroke-width="2"/>
    <text x="782" y="205" fill="#c4b5fd" font-size="12" font-weight="800" letter-spacing="1.4">04 · TRABAJO</text>
    <text x="782" y="237" fill="#f8fafc" font-size="21" font-weight="750">Supervisor</text>
    <text x="782" y="264" fill="#9fb0c4" font-size="14">dispatch de Work</text>

    <rect x="986" y="172" width="158" height="112" rx="20" fill="#111f33" stroke="#335271" stroke-width="2"/>
    <text x="1008" y="205" fill="#93c5fd" font-size="12" font-weight="800" letter-spacing="1.4">05 · WORKER</text>
    <text x="1008" y="237" fill="#f8fafc" font-size="21" font-weight="750">LLM + sandbox</text>
    <text x="1008" y="264" fill="#9fb0c4" font-size="14">ejecución reversible</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#io-map-dark-arrow)">
    <path d="M232 228 H282"/>
    <path d="M458 228 H534"/>
    <path d="M686 228 H760"/>
    <path d="M936 228 H986"/>
  </g>

  <text x="712" y="210" fill="#a5b4fc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800">SÍ</text>

  <path d="M610 291 V350 H382" fill="none" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#io-map-dark-arrow)"/>
  <text x="623" y="328" fill="#67e8f9" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800">NO</text>
  <rect x="160" y="334" width="220" height="92" rx="18" fill="#0b2630" stroke="#1f6470" stroke-width="2"/>
  <text x="184" y="367" fill="#67e8f9" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.3">SILENCIO ÚTIL</text>
  <text x="184" y="397" fill="#f8fafc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="800">0 tokens</text>
  <text x="184" y="418" fill="#9fb0c4" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">no-llm-heartbeat</text>

  <path d="M1066 284 V380 H820" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#io-map-dark-arrow)"/>
  <rect x="520" y="334" width="300" height="112" rx="20" fill="#171933" stroke="#4b457b" stroke-width="2"/>
  <text x="548" y="370" fill="#c4b5fd" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.3">06 · CIERRE VERIFICABLE</text>
  <text x="548" y="402" fill="#f8fafc" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="800">Receipts + journal</text>
  <text x="548" y="428" fill="#9fb0c4" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">evidencia → aprendizaje → siguiente evento</text>

  <path d="M520 390 H458 C412 390 370 364 370 318 V286" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#io-map-dark-arrow)"/>
  <text x="60" y="488" fill="#64748b" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" letter-spacing="1">AUTORIDAD HUMANA · PRESUPUESTO · EVIDENCIA · RECUPERACIÓN</text>
</svg>